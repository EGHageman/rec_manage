<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomePage</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.hero-img{
  width:100%;
  height:400px;          /* controls crop size */
  object-fit:cover;      /* crops instead of stretching */
  border-radius:15px;
}

.hero-section{
  padding:80px 0;
}

</style>

</head>

<body>

<!-- HERO SECTION -->
<section class="hero-section bg-light">
  <div class="container">

    <div class="row align-items-center">

      <!-- TEXT SIDE -->
      <div class="col-md-6">
        <h1 class="display-4 fw-bold">Rec Manage</h1>
        <p class="lead">
          Dynamic environment for managing active areas and resources.
        </p>

        <a href="/signup" class="btn btn-primary btn-lg">
            Organizer sign up
        </a>
        <a href="/employee_signup" class="btn btn-primary btn-lg">
            Employee sign up
        </a>
        <a href="/signin" class="btn btn-secondary btn-lg">
            sign in
        </a>
      </div>

      <!-- IMAGE SIDE -->
      <div class="col-md-6">
        <img src="../static/images/background_map.jpg"
             alt="Hero Image"
             class="hero-img img-fluid border border-3 border-dark shadow-lg">
      </div>

    </div>

  </div>
</section>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
