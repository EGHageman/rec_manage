<!DOCTYPE html>
<html>

<head>
    <title>employee map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/images/map.css" />

</head>

<body class="p-3">
    <h3>{{ org.name }} dashboard</h3>
    <a href="/" class="btn btn-outline-secondary btn-sm">
                        Sign Out
                    </a>

    <div id="map"></div>

    <div class="d-flex align-items-center gap-2 my-2">
        <button id="prevDay" class="btn btn-outline-secondary btn-sm">&larr;</button>
        <input type="date" id="shiftDate" class="form-control form-control-sm" style="width:160px;">
        <button id="nextDay" class="btn btn-outline-secondary btn-sm">&rarr;</button>
    </div>

    <script>
        window.initialMapCenter = {
            lat: {{ org.lat|default(44.4605)|tojson }},
            lng: {{ org.lng|default(-110.8281)|tojson }}
        };
    </script>
    <div class="table-responsive">
        <table class="table table-bordered table-sm">
            <thead class="table-dark">
                <tr>
                    <th>5:00</th>
                    <th>6:00</th>
                    <th>7:00</th>
                    <th>8:00</th>
                    <th>9:00</th>
                    <th>10:00</th>
                    <th>11:00</th>
                    <th>12:00</th>
                    <th>1:00</th>
                    <th>2:00</th>
                    <th>3:00</th>
                    <th>4:00</th>
                    <th>5:00</th>
                    <th>6:00</th>
                    <th>7:00</th>
                    <th>8:00</th>
                    <th>9:00</th>
                    <th>10:00</th>
                </tr>
            </thead>
            <tbody id="employeeZoneTable">
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/images/employee_map.js"></script>
</body>

</html>
